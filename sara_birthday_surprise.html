<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Poorvi Verma 🎂</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Trebuchet MS", system-ui, sans-serif;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,255,255,.16), transparent 28%),
      linear-gradient(135deg, #12002f, #2d0b59 45%, #071b49);
    color: #fff;
    display: grid;
    place-items: center;
    position: relative;
  }

  .stars, .stars::before, .stars::after {
    position: absolute; inset: 0; content: "";
    pointer-events: none;
  }
  .stars {
    background-image:
      radial-gradient(circle, rgba(255,255,255,.85) 1px, transparent 1.5px),
      radial-gradient(circle, rgba(255,220,120,.65) 1px, transparent 1.5px);
    background-size: 83px 97px, 137px 121px;
    background-position: 15px 20px, 40px 70px;
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity:.45; } to { opacity:1; } }

  .card {
    width: min(90vw, 720px);
    min-height: 430px;
    padding: 55px 30px 45px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 32px;
    background: rgba(255,255,255,.10);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 25px 80px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.2);
    text-align: center;
    position: relative;
    z-index: 10;
    overflow: hidden;
  }

  .badge {
    display: inline-block;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.22);
    letter-spacing: 3px;
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    margin-top: 18px;
    font-size: clamp(3rem, 10vw, 6.5rem);
    line-height: .95;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 18px rgba(255,112,214,.65), 0 0 45px rgba(117,215,255,.35);
  }

  .name {
    margin-top: 12px;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    letter-spacing: 10px;
    background: linear-gradient(90deg, #ffcf70, #ff76c8, #79e6ff, #ffcf70);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientMove 4s linear infinite;
  }
  @keyframes gradientMove { to { background-position: 300% 0; } }

  .subtitle {
    margin: 18px auto 30px;
    max-width: 510px;
    color: rgba(255,255,255,.82);
    font-size: 1.05rem;
  }

  #surpriseBtn {
    border: 0;
    cursor: pointer;
    padding: 17px 38px;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: 1px;
    color: #34104e;
    background: linear-gradient(135deg, #ffd86b, #ff8dcc);
    box-shadow: 0 10px 35px rgba(255,120,195,.35), 0 3px 0 #c75d99;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #surpriseBtn:hover { transform: translateY(-3px) scale(1.03); }
  #surpriseBtn:active { transform: translateY(2px) scale(.98); }
  #surpriseBtn:disabled { cursor: default; opacity: .8; }

  .hidden-message {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    transform: scale(.7);
    transition: opacity .55s ease, transform .55s cubic-bezier(.17,.89,.32,1.35);
  }
  .hidden-message.show { opacity: 1; transform: scale(1); }
  .message-box {
    text-align: center;
    padding: 35px;
    width: min(92vw, 760px);
    border-radius: 32px;
    background: rgba(20, 4, 48, .72);
    border: 1px solid rgba(255,255,255,.25);
    box-shadow: 0 20px 100px rgba(0,0,0,.45);
    backdrop-filter: blur(10px);
  }
  .message-box .small { font-size: 1.15rem; color: #ffe7f8; }
  .message-box h2 {
    margin: 7px 0;
    font-size: clamp(3rem, 10vw, 7rem);
    line-height: .95;
    background: linear-gradient(90deg, #ffe477, #ff75bd, #72e8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 35px rgba(255,255,255,.15);
  }
  .message-box p { color: rgba(255,255,255,.88); font-size: 1.15rem; }
  .balloon {
    position: fixed;
    bottom: -130px;
    width: 58px;
    height: 72px;
    border-radius: 50% 50% 45% 45%;
    z-index: 5;
    pointer-events: none;
    box-shadow: inset -10px -9px 18px rgba(0,0,0,.16), inset 9px 8px 14px rgba(255,255,255,.25);
    animation: fly linear forwards;
  }
  .balloon::before {
    content: "";
    position: absolute;
    width: 9px; height: 9px;
    bottom: -5px; left: 25px;
    background: inherit;
    transform: rotate(45deg);
  }
  .balloon::after {
    content: "";
    position: absolute;
    width: 1px; height: 150px;
    left: 29px; top: 70px;
    background: rgba(255,255,255,.65);
  }
  @keyframes fly {
    from { transform: translate(0,0) rotate(-5deg); opacity: 0; }
    8% { opacity: 1; }
    to { transform: translate(var(--drift), -115vh) rotate(12deg); opacity: .95; }
  }

  .firework {
    position: fixed;
    width: 5px; height: 5px;
    border-radius: 50%;
    z-index: 6;
    pointer-events: none;
    animation: boom 1.1s ease-out forwards;
  }
  @keyframes boom {
    0% { box-shadow: 0 0 transparent; opacity: 1; transform: scale(.2); }
    35% {
      transform: scale(1);
      box-shadow:
        0 -75px 0 1px currentColor,
        0 75px 0 1px currentColor,
        75px 0 0 1px currentColor,
        -75px 0 0 1px currentColor,
        53px 53px 0 1px currentColor,
        -53px 53px 0 1px currentColor,
        53px -53px 0 1px currentColor,
        -53px -53px 0 1px currentColor,
        0 -105px 0 0 currentColor,
        0 105px 0 0 currentColor,
        105px 0 0 0 currentColor,
        -105px 0 0 0 currentColor;
    }
    100% { opacity: 0; transform: scale(1.25); }
  }

  .confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 18px;
    z-index: 25;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translate3d(var(--x), 110vh, 0) rotate(720deg); opacity: .95; }
  }

  .cake {
    font-size: 2.5rem;
    margin-bottom: 5px;
    animation: cakeBounce 1s ease-in-out infinite alternate;
  }
  @keyframes cakeBounce { to { transform: translateY(-5px) rotate(2deg); } }

  @media (max-width: 600px) {
    .card { min-height: 390px; padding: 42px 20px 35px; }
    .subtitle { font-size: .95rem; }
    .balloon { width: 45px; height: 58px; }
  }
</style>
</head>
<body>
<div class="stars"></div>

<main class="card">
  <div class="badge">A little surprise for you</div>
  <div class="cake">🎂</div>
  <h1>HEY!</h1>
  <div class="name">POORVI VERMA</div>
  <p class="subtitle">There’s something special waiting behind this button…</p>
  <button id="surpriseBtn" aria-label="Open birthday surprise">🎁 Surprise</button>
</main>

<section class="hidden-message" id="birthdayMessage" aria-live="polite">
  <div class="message-box">
    <div class="small">✨ Today is all about you ✨</div>
    <h2>HAPPY<br>BIRTHDAY!</h2>
    <p>🎉 Wishing you a day filled with laughter, happiness & unforgettable moments, Poorvi! 💖</p>
  </div>
</section>

<script>
  const button = document.getElementById("surpriseBtn");
  const message = document.getElementById("birthdayMessage");
  let audioContext;

  function playPop() {
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume();
      const now = audioContext.currentTime;

      // Soft pop + sparkle sweep generated locally: no external audio file needed.
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(780, now + 0.13);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      osc.connect(gain).connect(audioContext.destination);
      osc.start(now);
      osc.stop(now + 0.24);

      const chime = audioContext.createOscillator();
      const chimeGain = audioContext.createGain();
      chime.type = "triangle";
      chime.frequency.setValueAtTime(880, now + .06);
      chime.frequency.exponentialRampToValueAtTime(1320, now + .25);
      chimeGain.gain.setValueAtTime(0.0001, now + .06);
      chimeGain.gain.exponentialRampToValueAtTime(0.12, now + .09);
      chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + .34);
      chime.connect(chimeGain).connect(audioContext.destination);
      chime.start(now + .06);
      chime.stop(now + .36);

      playHappyBirthday(now + 0.45);
    } catch (e) {}
  }

  function playHappyBirthday(startTime) {
    const notes = [
      [392, 0.28], [392, 0.28], [440, 0.56], [392, 0.56], [523.25, 0.56], [493.88, 1.12],
      [392, 0.28], [392, 0.28], [440, 0.56], [392, 0.56], [587.33, 0.56], [523.25, 1.12],
      [392, 0.28], [392, 0.28], [783.99, 0.56], [659.25, 0.56], [523.25, 0.56], [493.88, 0.56], [440, 1.12],
      [698.46, 0.28], [698.46, 0.28], [659.25, 0.56], [523.25, 0.56], [587.33, 0.56], [523.25, 1.12]
    ];

    let offset = startTime;
    notes.forEach(([frequency, duration]) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(frequency, offset);
      gain.gain.setValueAtTime(0.0001, offset);
      gain.gain.exponentialRampToValueAtTime(0.09, offset + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, offset + duration - 0.04);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(offset);
      oscillator.stop(offset + duration);
      offset += duration;
    });
  }

  function createBalloon(i) {
    const b = document.createElement("div");
    b.className = "balloon";
    const colors = ["#ff5fa2", "#65d9ff", "#ffd45e", "#a879ff", "#65f0ad", "#ff8a65"];
    b.style.background = colors[i % colors.length];
    b.style.left = (Math.random() * 100) + "vw";
    b.style.setProperty("--drift", ((Math.random() * 240) - 120) + "px");
    b.style.animationDuration = (5 + Math.random() * 4) + "s";
    b.style.animationDelay = (Math.random() * .7) + "s";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 10000);
  }

  function createFirework(x, y) {
    const f = document.createElement("div");
    f.className = "firework";
    f.style.left = x + "px";
    f.style.top = y + "px";
    f.style.color = ["#ff77c8", "#ffe66d", "#67e8ff", "#a98bff", "#7dffb2"][Math.floor(Math.random()*5)];
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }

  function createConfetti(count = 130) {
    for (let i = 0; i < count; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.setProperty("--x", ((Math.random() * 260) - 130) + "px");
      c.style.background = ["#ff6eb4", "#ffd95c", "#6fe7ff", "#a985ff", "#7dffb1"][Math.floor(Math.random()*5)];
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      c.style.animationDuration = (3 + Math.random() * 4) + "s";
      c.style.animationDelay = (Math.random() * 1.3) + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 8500);
    }
  }

  function celebration() {
    playPop();
    message.classList.add("show");
    button.textContent = "🎉 Surprise!";
    button.disabled = true;

    for (let i = 0; i < 24; i++) setTimeout(() => createBalloon(i), i * 110);

    const positions = [
      [16, 24], [82, 21], [27, 39], [73, 36],
      [50, 18], [9, 61], [91, 58], [50, 8]
    ];
    positions.forEach((p, i) => {
      setTimeout(() => {
        createFirework(window.innerWidth * p[0]/100, window.innerHeight * p[1]/100);
      }, i * 250);
    });

    createConfetti(150);

    // Keep the fireworks alive for a few extra moments.
    let bursts = 0;
    const interval = setInterval(() => {
      createFirework(
        window.innerWidth * (.08 + Math.random() * .84),
        window.innerHeight * (.08 + Math.random() * .48)
      );
      if (++bursts >= 12) clearInterval(interval);
    }, 650);
  }

  button.addEventListener("click", celebration);
</script>
</body>
</html>
